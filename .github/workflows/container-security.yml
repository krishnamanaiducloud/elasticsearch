name: Container security
on:
  pull_request:
  push:
    branches: [main, 'release/**']
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-test-scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Build and smoke test
        run: make smoke
      - name: Trivy scan
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          TRIVY_VEX: security/vex/elasticsearch.openvex.json
          TRIVY_EXIT_ON_EOL: '1'
        with:
          image-ref: mohankrishna999/elasticsearch:9.5.6.1-patched
          scanners: vuln
          vuln-type: os,library
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '1'
      - name: Grype scan
        uses: anchore/scan-action@v7
        with:
          image: mohankrishna999/elasticsearch:9.5.6.1-patched
          fail-build: true
          severity-cutoff: negligible

